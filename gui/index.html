<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRANGE Control</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head>
<body>
<section id="login"><form id="login-form"><div class="brand-mark">CR</div><h1>CRANGE Control</h1><p class="muted">Infrastructure operations</p><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button><p id="login-error" role="alert"></p></form></section>
<div id="dashboard" hidden><aside class="sidebar"><div class="brand"><span class="brand-mark">CR</span><div><strong>CRANGE</strong><small>CONTROL</small></div></div><div class="nav-label">Platform</div><nav id="global-nav"><button data-view="overview">Overview</button><button data-view="projects">Projects</button><button data-view="users" data-admin-only>CRANGE Users</button><button data-view="jobs">Jobs</button><button data-view="templates" data-admin-only>Templates</button><button data-view="cluster" data-admin-only>Cluster</button></nav><div class="project-context"><label class="project-picker">Project<select id="project" aria-label="Project" disabled><option value="">Loading projects…</option></select></label><div id="project-name" class="visually-hidden"></div></div><div id="project-nav" hidden><nav><button data-view="project-overview">Project Overview</button><button data-view="teams">Teams</button><button data-view="scenario">Scenario</button><button data-view="project-users">Users</button><button data-view="project-settings">Settings</button></nav></div><div class="sidebar-bottom"><span id="session-user" class="muted"></span><button id="logout" class="quiet">Sign out</button></div></aside>
<main><header class="page-header"><div class="page-heading"><div id="section-label" hidden></div><h2 id="title">Overview</h2></div><div class="header-actions"><button id="refresh" class="quiet">Refresh</button></div></header><p id="error" role="alert"></p><section id="content" aria-labelledby="title" aria-busy="true"><div class="load-state" role="status"><span class="spinner" aria-hidden="true"></span><p>Loading workspace…</p></div></section><section id="action-panel" class="card action-panel" role="dialog" aria-modal="true" aria-labelledby="action-title" hidden><div class="panel-heading"><div><h3 id="action-title">Action</h3></div><button id="close-action" class="quiet">Close</button></div><form id="job-form"><select name="operation" id="operation" aria-hidden="true"></select><div id="job-fields"></div><button class="primary">Run action</button></form><p id="job-message" role="status"></p></section></main></div><div id="job-overlay" class="job-overlay" hidden><section id="job-dialog" class="job-dialog" role="dialog" aria-modal="true" aria-labelledby="job-dialog-title"><div class="panel-heading"><div><h3 id="job-dialog-title">Action</h3></div><button id="close-job" class="quiet">Close</button></div><p id="job-dialog-status" class="job-dialog-status" aria-live="polite">Queued</p><pre id="job-dialog-output">Waiting for worker…</pre><p class="muted">Closing this window leaves the job running. Reopen its output from Jobs.</p></section></div><div id="task-indicator" class="task-indicator" aria-live="polite" hidden></div><div id="notices" class="notices" aria-live="polite"></div><script src="/app.js"></script><script src="/users.js"></script><script src="/templates.js"></script><script src="/lifecycle.js"></script><script src="/accounts.js"></script></body></html>
