<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRANGE Control</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<section id="login"><form id="login-form"><div class="brand-mark">CR</div><h1>CRANGE Control</h1><p class="muted">Infrastructure operations console</p><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button><p id="login-error" role="alert"></p></form></section>
<div id="dashboard" hidden><aside class="sidebar"><div class="brand"><span class="brand-mark">CR</span><div><strong>CRANGE</strong><small>CONTROL</small></div></div><div class="nav-label">Platform</div><nav id="global-nav"><button data-view="overview">Overview</button><button data-view="projects">Projects</button><button data-view="users" data-admin-only>CRANGE Users</button><button data-view="jobs">Jobs</button></nav><div id="project-nav" hidden><div class="nav-label">Current project</div><div id="project-name" class="project-name"></div><nav><button data-view="project-overview">Project Overview</button><button data-view="teams">Teams</button><button data-view="scenario">Scenario</button><button data-view="project-users">Users</button></nav></div><div class="sidebar-bottom"><span id="session-user" class="muted"></span><button id="logout" class="quiet">Sign out</button></div></aside>
<main><header><div><div class="eyebrow" id="section-label">CRANGE</div><h2 id="title">Overview</h2></div><div class="header-actions"><label class="project-picker">Project<select id="project" aria-label="Project"></select></label><button id="refresh" class="quiet">Refresh</button></div></header><p id="error" role="alert"></p><section id="content"></section><section id="action-panel" class="card action-panel" hidden><div class="panel-heading"><div><div class="eyebrow">ACTION</div><h3 id="action-title">Action</h3></div><button id="close-action" class="quiet">Close</button></div><form id="job-form"><select name="operation" id="operation" aria-hidden="true"></select><div id="job-fields"></div><button class="primary">Run action</button></form><p id="job-message" role="status"></p></section></main></div><div id="job-overlay" class="job-overlay" hidden><section id="job-dialog" class="job-dialog" role="dialog" aria-modal="true" aria-labelledby="job-dialog-title"><div class="panel-heading"><div><div class="eyebrow">BACKGROUND JOB</div><h3 id="job-dialog-title">Action</h3></div><button id="close-job" class="quiet">Close</button></div><p id="job-dialog-status" class="job-dialog-status" aria-live="polite">Queued</p><pre id="job-dialog-output">Waiting for worker…</pre><p class="muted">Closing this window leaves the job running. Reopen its output from Jobs.</p></section></div><script src="/app.js"></script></body></html>
