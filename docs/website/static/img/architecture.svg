<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">CRANGE architecture</title><desc id="desc">Control browser calls Python API and durable queue. Fixed workers run Terraform, Ansible and Guacamole workflows using protected configuration. Proxmox provides guests and isolated networks; immutable archives and local caches supply images.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#527387"/></marker></defs><rect width="1000" height="500" fill="#f5f8fa"/><g stroke="#527387" stroke-width="2" marker-end="url(#a)"><path d="M190 90H245"/><path d="M455 90H510"/><path d="M720 90H775"/><path d="M615 135V210"/><path d="M350 255H510"/><path d="M615 300V375"/><path d="M720 255H775"/></g><g fill="#fff" stroke="#b1c2cd"><rect x="20" y="45" width="170" height="90" rx="6"/><rect x="245" y="45" width="210" height="90" rx="6"/><rect x="510" y="45" width="210" height="90" rx="6"/><rect x="775" y="45" width="205" height="90" rx="6"/><rect x="510" y="210" width="210" height="90" rx="6"/><rect x="140" y="210" width="210" height="90" rx="6"/><rect x="775" y="210" width="205" height="90" rx="6"/><rect x="510" y="375" width="210" height="90" rx="6"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#213b4b" font-size="18"><text x="105" y="85">Control browser</text><text x="350" y="85">Python API</text><text x="615" y="85">Durable queue</text><text x="877" y="85">Jobs / audit</text><text x="615" y="250">Fixed workers</text><text x="245" y="250">Protected policy</text><text x="877" y="250">Image library</text><text x="615" y="415">Proxmox cluster</text></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#526b7b" font-size="14"><text x="105" y="110">Local UI + sessions</text><text x="350" y="110">Roles · CSRF · validation</text><text x="615" y="110">SQLite · project lanes</text><text x="877" y="110">Progress · history</text><text x="615" y="275">Terraform · Ansible · Guac</text><text x="245" y="275">Credentials · catalog · plans</text><text x="877" y="275">Archives → local caches</text><text x="615" y="440">VMs · LXCs · SDN · routers</text></g></svg>