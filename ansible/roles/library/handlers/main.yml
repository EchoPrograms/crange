---
- name: Restart Ganesha
  ansible.builtin.systemd_service:
    name: nfs-ganesha
    state: restarted

- name: Reload library firewall
  ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.conf
  changed_when: true

- name: Reload SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
