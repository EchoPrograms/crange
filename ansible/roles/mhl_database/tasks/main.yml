---
- name: Validate assigned database address
  ansible.builtin.assert:
    that:
      - (mhl_network_id | int in [1, 2, 3, 4, 5, 254]) or ((mhl_test_scope | default(false) | bool) and (1 <= mhl_network_id | int <= 253))
      - ansible_host == '10.100.' ~ (mhl_network_id | string) ~ '.30'
      - mhl_db_runtime_password is defined
      - mhl_db_runtime_password is match('^[A-Za-z0-9_-]{20,128}$')
    fail_msg: Define the database password through the protected project vars file.

- name: Install PostgreSQL and Python driver
  ansible.builtin.apt:
    name: [postgresql, python3-psycopg2, sudo]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Discover the installed PostgreSQL cluster
  ansible.builtin.command: pg_lsclusters --no-header
  register: mhl_postgres_clusters
  changed_when: false

- name: Require one active PostgreSQL cluster
  ansible.builtin.assert:
    that:
      - mhl_postgres_clusters.stdout_lines | length == 1
      - mhl_postgres_clusters.stdout.split()[0] is match('^[0-9]+$')
      - mhl_postgres_clusters.stdout.split()[3] == 'online'
    fail_msg: The database role expects exactly one online Debian PostgreSQL cluster.

- name: Record installed PostgreSQL configuration path
  ansible.builtin.set_fact:
    mhl_postgres_config_dir: "/etc/postgresql/{{ mhl_postgres_clusters.stdout.split()[0] }}/{{ mhl_postgres_clusters.stdout.split()[1] }}"

- name: Set PostgreSQL to listen on the team LAN
  ansible.builtin.lineinfile:
    path: "{{ mhl_postgres_config_dir }}/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '{{ mhl_db_ip }}'"
  notify: Restart PostgreSQL

- name: Permit only the matching application host to connect
  ansible.builtin.lineinfile:
    path: "{{ mhl_postgres_config_dir }}/pg_hba.conf"
    insertafter: '^# IPv4 local connections:'
    line: "host    mhl_ops    mhl_runtime    {{ mhl_app_ip }}/32    scram-sha-256"
    state: present
  notify: Restart PostgreSQL

- name: Ensure PostgreSQL is enabled and running
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Apply pending PostgreSQL configuration before database setup
  ansible.builtin.meta: flush_handlers

- name: Read the active PostgreSQL listen address
  community.postgresql.postgresql_query:
    db: postgres
    query: SHOW listen_addresses
  become_user: postgres
  register: mhl_active_listen
  changed_when: false

- name: Activate configuration left pending by an interrupted prior run
  ansible.builtin.service:
    name: postgresql
    state: restarted
  when: mhl_active_listen.query_result[0].listen_addresses != mhl_db_ip

- name: Create runtime database role with deliberately excessive CREATEDB privilege
  community.postgresql.postgresql_user:
    name: mhl_runtime
    password: "{{ mhl_db_runtime_password }}"
    role_attr_flags: LOGIN,CREATEDB
    state: present
  become_user: postgres
  no_log: true

- name: Create the MHL operations database
  community.postgresql.postgresql_db:
    name: mhl_ops
    owner: mhl_runtime
    state: present
  become_user: postgres

- name: Install idempotent synthetic shipment schema
  ansible.builtin.copy:
    src: schema.sql
    dest: /usr/local/share/mhl-schema.sql
    owner: root
    group: root
    mode: "0644"

- name: Load synthetic shipment records
  community.postgresql.postgresql_script:
    db: mhl_ops
    path: /usr/local/share/mhl-schema.sql
  become_user: postgres

- name: Apply pending PostgreSQL restart
  ansible.builtin.meta: flush_handlers
