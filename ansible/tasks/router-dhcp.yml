---
- name: Install dnsmasq on team routers
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: false
  when: "'team_routers' in group_names or 'staging_routers' in group_names or 'custom_routers' in group_names"

- name: Configure DHCP service for this team subnet
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/crange-dhcp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # DHCP only; clients query OPNsense directly for DNS.
      port=0
      interface={{ router_downstream_interface | default('eth1') }}
      listen-address={{ router_dhcp_gateway }}
      bind-dynamic
      dhcp-authoritative
      dhcp-range={{ router_dhcp_start }},{{ router_dhcp_end }},255.255.255.0,12h
      dhcp-option=option:router,{{ router_dhcp_gateway }}
      dhcp-option=option:dns-server,{{ router_dns_ip }}
  when: "'team_routers' in group_names or 'staging_routers' in group_names or 'custom_routers' in group_names"
  notify: Restart team DHCP service

- name: Enable and start team DHCP service
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
  when: "'team_routers' in group_names or 'staging_routers' in group_names or 'custom_routers' in group_names"
